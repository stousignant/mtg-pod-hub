<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="symbolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGradient)" stroke="#1e1b4b" stroke-width="2"/>

  <!-- MTG-inspired symbol (stylized mana/pentagram) -->
  <path d="M50 15 L60 42 L87 42 L65 58 L75 85 L50 69 L25 85 L35 58 L13 42 L40 42 Z"
        fill="url(#symbolGradient)"
        stroke="#1e1b4b"
        stroke-width="1.5"
        opacity="0.95"/>

  <!-- Center circle highlight -->
  <circle cx="50" cy="50" r="12" fill="#1e1b4b" opacity="0.3"/>

  <!-- Shine effect -->
  <circle cx="40" cy="35" r="8" fill="white" opacity="0.2"/>
</svg>
